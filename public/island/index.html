<!DOCTYPE html>
<html lang="zh-CN" data-ui="island">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19c8b9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>家庭衣橱</title>
  <script type="module">
    import { UI_PREFERENCE_KEY, resolveUiTarget } from '/public/island/js/preference.mjs';
    const url = new URL(location.href);
    const explicit = url.searchParams.get('ui');
    if (explicit === 'island' || explicit === 'classic') localStorage.setItem(UI_PREFERENCE_KEY, explicit);
    const target = resolveUiTarget({ url, storedPreference: localStorage.getItem(UI_PREFERENCE_KEY) });
    if (target) location.replace(target);
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/public/island/assets/icons/icon-shopping.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/public/island/assets/pwa/icon-shopping-192.png">
  <link rel="stylesheet" href="/public/island/styles/tokens.css">
  <link rel="stylesheet" href="/public/island/styles/base.css">
  <link rel="stylesheet" href="/public/island/styles/app.css">
  <link rel="stylesheet" href="/public/island/styles/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/view"><span class="brand-mark"><img src="/public/island/assets/icons/icon-shopping.svg" alt=""></span><span><strong>家庭衣橱</strong><small>Wardrobe Island</small></span></a>
      <nav id="sidebar-nav"></nav>
      <details class="system-menu">
        <summary class="system-trigger"><img src="/public/island/assets/icons/icon-design.svg" alt=""><span>系统与账户</span><span class="menu-chevron" aria-hidden="true">⌄</span></summary>
        <div class="system-popover">
          <button class="system-action" type="button" data-auth-action><img src="/public/island/assets/icons/icon-design.svg" alt=""><span>管理登录</span></button>
          <button class="system-action" type="button" data-install-app><img src="/public/island/assets/icons/icon-diy.svg" alt=""><span>安装应用</span></button>
          <a class="system-action" href="/classic/view" data-classic-link><img src="/public/island/assets/icons/icon-variant.svg" alt=""><span>经典界面</span></a>
        </div>
      </details>
    </aside>

    <header class="tablet-header">
      <a class="brand" href="/view"><span class="brand-mark"><img src="/public/island/assets/icons/icon-shopping.svg" alt=""></span><span><strong>家庭衣橱</strong></span></a>
      <nav id="tablet-nav" aria-label="主导航"></nav>
      <details class="system-menu">
        <summary class="system-trigger system-trigger--compact" aria-label="系统与账户"><img src="/public/island/assets/icons/icon-design.svg" alt=""></summary>
        <div class="system-popover">
          <button class="system-action" type="button" data-auth-action><img src="/public/island/assets/icons/icon-design.svg" alt=""><span>管理登录</span></button>
          <button class="system-action" type="button" data-install-app><img src="/public/island/assets/icons/icon-diy.svg" alt=""><span>安装应用</span></button>
          <a class="system-action" href="/classic/view" data-classic-link><img src="/public/island/assets/icons/icon-variant.svg" alt=""><span>经典界面</span></a>
        </div>
      </details>
    </header>

    <header class="mobile-header">
      <a class="brand" href="/view"><span class="brand-mark"><img src="/public/island/assets/icons/icon-shopping.svg" alt=""></span><span id="mobile-title">衣橱</span></a>
      <details class="system-menu">
        <summary class="system-trigger system-trigger--compact" aria-label="系统与账户"><img src="/public/island/assets/icons/icon-design.svg" alt=""></summary>
        <div class="system-popover">
          <button class="system-action" type="button" data-auth-action><img src="/public/island/assets/icons/icon-design.svg" alt=""><span>管理登录</span></button>
          <button class="system-action" type="button" data-install-app><img src="/public/island/assets/icons/icon-diy.svg" alt=""><span>安装应用</span></button>
          <a class="system-action" href="/classic/view" data-classic-link><img src="/public/island/assets/icons/icon-variant.svg" alt=""><span>经典界面</span></a>
        </div>
      </details>
    </header>

    <main id="main-view" tabindex="-1">
      <section id="wardrobe-view" class="app-view" data-section="wardrobe"><div class="initial-loading" role="status">正在整理衣橱…</div></section>
      <section id="add-view" class="app-view" data-section="add" hidden></section>
      <section id="members-view" class="app-view" data-section="members" hidden></section>
      <section id="stats-view" class="app-view" data-section="stats" hidden></section>
    </main>

    <nav id="mobile-nav" class="mobile-nav" aria-label="主导航"></nav>
  </div>

  <div id="filter-drawer" class="overlay drawer-overlay" role="dialog" aria-modal="true" aria-labelledby="filter-title" hidden tabindex="-1">
    <aside class="drawer island-panel">
      <button class="island-icon-button dialog-close" type="button" aria-label="关闭">×</button>
      <p class="section-kicker">整理视图</p><h2 id="filter-title">筛选衣橱</h2>
      <img class="drawer-divider" src="/public/island/assets/dividers/divider-line-teal.svg" alt="">
      <div id="filter-content"></div>
    </aside>
  </div>
  <div id="detail-dialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden tabindex="-1"><div class="dialog detail-dialog island-panel"><button class="island-icon-button dialog-close" type="button" aria-label="关闭">×</button><div id="detail-content"></div></div></div>
  <div id="confirm-dialog" class="overlay" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" hidden tabindex="-1"><div class="dialog confirm-dialog island-panel"><h2 id="confirm-title">请确认</h2><p id="confirm-message"></p><div class="dialog-actions"><button class="island-button confirm-cancel" type="button">取消</button><button class="island-button island-button--primary confirm-accept" type="button">确认</button></div></div></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="/public/shared/utils.js"></script>
  <script type="module" src="/public/island/js/pwa.mjs"></script>
  <script type="module" src="/public/island/js/app.mjs"></script>
</body>
</html>
